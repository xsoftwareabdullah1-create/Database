<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><title>Webbase — Backend Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080d18;--panel:#0e1625;--panel2:#111d30;--line:#1e2b40;--text:#edf4ff;--muted:#8190a8;--blue:#6c8cff;--cyan:#43d9e8;--green:#4adea1;--red:#ff6f83}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -20%,#1a2b50 0,transparent 48%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:22px}.auth-card{width:min(430px,100%);padding:34px;background:#0e1625eF;border:1px solid var(--line);border-radius:22px;box-shadow:0 25px 90px #0008}.brand{display:flex;align-items:center;gap:12px;font:700 22px 'Space Grotesk'}.logo{width:39px;height:39px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;color:#07101d;font-size:21px}.muted{color:var(--muted)}h1,h2,h3,p{margin-top:0}h1{font:700 29px 'Space Grotesk';margin:28px 0 8px}.field{display:grid;gap:8px;margin:17px 0}.field label{font-size:13px;color:#aab7ca}.field input,.field textarea{width:100%;padding:13px 14px;background:#080f1d;border:1px solid var(--line);border-radius:10px;color:var(--text);outline:none}.field input:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #6c8cff22}.btn{border:1px solid #6c8cff88;color:#dfe8ff;background:#172644;border-radius:10px;padding:11px 16px;font-weight:600;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{transform:translateY(-2px);background:#20365f;border-color:var(--blue);box-shadow:0 8px 24px #426bff22}.btn:active{transform:scale(.97)}.btn.primary{background:linear-gradient(110deg,#5476f5,#4e9fe8);border-color:#8aa4ff;color:white}.btn.ghost{background:transparent;border-color:var(--line)}.btn.danger{border-color:#ff6f8355;color:#ff9aaa;background:#301b2a}.full{width:100%}.auth-switch{margin-top:20px;text-align:center;font-size:13px}.link{color:#8ba5ff;cursor:pointer}.layout{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);background:#0b1220;padding:23px 16px;display:flex;flex-direction:column;gap:28px}.side .brand{padding:0 8px}.nav-label{font-size:10px;letter-spacing:1.5px;color:#61718a;padding:0 11px;margin-bottom:9px}.nav{display:grid;gap:5px}.nav button{background:none;border:1px solid transparent;color:#94a3b8;text-align:left;padding:11px;border-radius:9px}.nav button.active,.nav button:hover{background:#17233a;border-color:#243757;color:white}.side-bottom{margin-top:auto}.main{min-width:0}.top{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:#0b1220aa;position:sticky;top:0;z-index:3;backdrop-filter:blur(12px)}.crumb{font-size:13px;color:var(--muted)}.content{padding:32px;max-width:1400px;margin:auto}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:26px}.heading h1{margin:0 0 7px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.stat,.card{background:linear-gradient(145deg,#111d30,#0d1727);border:1px solid var(--line);border-radius:15px;padding:20px}.stat small{color:var(--muted)}.stat strong{display:block;font:700 28px 'Space Grotesk';margin:12px 0 4px}.section-title{font:600 17px 'Space Grotesk';margin:30px 0 14px}.project-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.project{padding:18px;border:1px solid var(--line);background:#0e1727;border-radius:13px;cursor:pointer;transition:.2s}.project:hover{border-color:#526fba;transform:translateY(-2px)}.project-top{display:flex;justify-content:space-between;align-items:center}.project-icon{width:38px;height:38px;border-radius:11px;background:#1d2d4b;display:grid;place-items:center;color:#91aaff;font-size:18px}.tag{font-size:11px;color:#80e7c1;background:#16352f;padding:5px 9px;border-radius:20px}.project h3{margin:15px 0 6px;font:600 16px 'Space Grotesk'}.project-meta{color:var(--muted);font-size:12px}.empty{border:1px dashed #31415b;border-radius:14px;padding:38px;text-align:center;color:var(--muted)}.workspace{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px}.collection-panel,.data-panel{background:#0e1727;border:1px solid var(--line);border-radius:14px;padding:17px;min-width:0}.collection-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:8px;color:#aebbd0;cursor:pointer;font-size:13px}.collection-item.active,.collection-item:hover{background:#1a2942;color:white}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:#8291a9;font-weight:500}td{color:#d3dced}.modal-back{position:fixed;inset:0;background:#020611bb;z-index:9;display:grid;place-items:center;padding:18px}.modal{width:min(500px,100%);background:#111c2e;border:1px solid #2a3b57;border-radius:17px;padding:24px;box-shadow:0 25px 90px #0009}.modal h2{font:600 20px 'Space Grotesk'}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#17283d;border:1px solid #385275;padding:12px 18px;border-radius:11px;z-index:20;box-shadow:0 10px 30px #0008;font-size:13px}.toast.error{border-color:#a64c60}.mobile-menu{display:none}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:fixed;z-index:5;left:-270px;top:0;bottom:0;width:250px;transition:.25s}.side.open{left:0;box-shadow:20px 0 60px #0008}.mobile-menu{display:inline-flex}.top{padding:0 17px}.content{padding:22px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.workspace{grid-template-columns:1fr}.project-list{grid-template-columns:1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.heading{flex-direction:column}.top{height:64px}.auth-card{padding:25px}.content{padding-top:20px}}
</style></head><body>
<section id="authView" class="auth"><div class="auth-card"><div class="brand"><div class="logo">W</div>webbase</div><h1 id="authTitle">Build on your data.</h1><p class="muted" id="authSub">A simple backend platform for your next idea.</p><form id="authForm"><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required placeholder="At least 8 characters"></div><button class="btn primary full" id="authSubmit">Create account <span>→</span></button></form><div class="auth-switch"><span class="muted" id="switchText">Already have an account?</span> <span class="link" id="switchAuth">Sign in</span></div><p class="muted" style="font-size:11px;margin:20px 0 0;text-align:center">Your projects are private to your account.</p></div></section>
<div id="appView" class="layout hidden"><aside class="side" id="sidebar"><div class="brand"><div class="logo">W</div>webbase</div><div><div class="nav-label">WORKSPACE</div><div class="nav"><button class="active" data-page="overview">◫ &nbsp; Overview</button><button data-page="projects">▦ &nbsp; Projects</button><button data-page="docs">⌘ &nbsp; Documentation</button></div></div><div class="side-bottom"><div class="nav-label">ACCOUNT</div><div class="nav"><button id="logout">↪ &nbsp; Sign out</button></div><p class="muted" style="font-size:11px;padding:10px">Webbase Console · v1.0</p></div></aside>
<main class="main"><header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="btn ghost mobile-menu" id="menuBtn">☰</button><span class="crumb" id="breadcrumb">Workspace / Overview</span></div><div style="display:flex;align-items:center;gap:12px"><span class="tag">● API online</span><span id="userEmail" class="muted" style="font-size:12px"></span></div></header><div class="content" id="page"></div></main></div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);let token=localStorage.getItem('webbase_token'),user=null,projects=[],currentProject=null,collections=[],currentCollection=null,documents=[],projectApps=[],projectKeys=[],authMode='register',pageName='overview';
const api=async(path,options={})=>{const r=await fetch('/api'+path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(options.headers||{})}});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||'Request failed');return data};
function toast(msg,error=false){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden','error');if(error)el.classList.add('error');setTimeout(()=>el.classList.add('hidden'),3000)}
function showAuth(){token=null;localStorage.removeItem('webbase_token');$('#appView').classList.add('hidden');$('#authView').classList.remove('hidden')}
function setAuthMode(mode){authMode=mode;$('#authTitle').textContent=mode==='register'?'Build on your data.':'Welcome back.';$('#authSub').textContent=mode==='register'?'Create your workspace in seconds.':'Sign in to continue to your workspace.';$('#authSubmit').innerHTML=mode==='register'?'Create account <span>→</span>':'Sign in <span>→</span>';$('#switchText').textContent=mode==='register'?'Already have an account?':'New to Webbase?';$('#switchAuth').textContent=mode==='register'?'Sign in':'Create account';$('#password').autocomplete=mode==='register'?'new-password':'current-password'}
$('#switchAuth').onclick=()=>setAuthMode(authMode==='register'?'login':'register');
$('#authForm').onsubmit=async e=>{e.preventDefault();const btn=$('#authSubmit');btn.disabled=true;try{const d=await api('/auth/'+authMode,{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});token=d.token;localStorage.setItem('webbase_token',token);user=d.user;await boot()}catch(err){toast(err.message,true)}finally{btn.disabled=false}};
$('#logout').onclick=showAuth;$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
function navigate(p){pageName=p;$('#sidebar').classList.remove('open');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#breadcrumb').textContent='Workspace / '+p[0].toUpperCase()+p.slice(1);if(p==='overview'||p==='projects')renderProjects();else if(p==='docs')renderDocs()}
async function loadProjects(){const d=await api('/projects');projects=d.projects}
function renderProjects(){const isOverview=pageName==='overview';$('#page').innerHTML=`
<div class="heading"><div><h1>${isOverview?'Your workspace':'Projects'}</h1><p class="muted">${isOverview?'Everything you need to build and scale your backend.':'Manage your apps, data and backend resources.'}</p></div><button class="btn primary" id="newProject">＋ New project</button></div>
<div class="grid"><div class="stat"><small>Total projects</small><strong>${projects.length}</strong><span class="muted" style="font-size:12px">Your applications</span></div><div class="stat"><small>Collections</small><strong>${projects.reduce((n,p)=>n+Number(p.collections||0),0)}</strong><span class="muted" style="font-size:12px">Data collections</span></div><div class="stat"><small>Documents</small><strong>${projects.reduce((n,p)=>n+Number(p.documents||0),0)}</strong><span class="muted" style="font-size:12px">Stored JSON records</span></div></div>
<div class="section-title">Your projects</div><div class="project-list">${projects.length?projects.map(p=>`<article class="project" data-project="${p.id}"><div class="project-top"><div class="project-icon">▦</div><span class="tag">Active</span></div><h3>${escapeHtml(p.name)}</h3><div class="project-meta">${p.collections} collections · ${p.documents} documents</div></article>`).join(''):'<div class="empty" style="grid-column:1/-1"><div style="font-size:28px;margin-bottom:10px">◇</div><b>No projects yet</b><p style="margin:8px 0 16px">Create your first project to start storing data.</p><button class="btn primary" id="emptyCreate">Create a project</button></div>'}</div>`;
$('#newProject').onclick=openProjectModal;const empty=$('#emptyCreate');if(empty)empty.onclick=openProjectModal;document.querySelectorAll('[data-project]').forEach(el=>el.onclick=()=>openProject(el.dataset.project))}
function openProjectModal(){modal('New project','Give your backend project a name.',`<div class="field"><label>Project name</label><input id="projectName" maxlength="80" placeholder="My awesome app"></div><div class="field"><label>Region</label><select id="projectRegion" style="padding:12px;background:#080f1d;color:white;border:1px solid var(--line);border-radius:10px;width:100%"><option value="us-central">US Central</option><option value="asia-south">Asia South</option><option value="europe-west">Europe West</option></select></div>`,async()=>{const name=$('#projectName').value.trim();if(name.length<2)throw new Error('Enter at least 2 characters');await api('/projects',{method:'POST',body:JSON.stringify({name,region:$('#projectRegion').value})});closeModal();await loadProjects();renderProjects();toast('Project created')})}
async function openProject(id){try{currentProject=projects.find(p=>p.id===id);collections=(await api('/projects/'+id+'/collections')).collections;const [a,k]=await Promise.all([api('/projects/'+id+'/apps'),api('/projects/'+id+'/api-keys')]);projectApps=a.apps;projectKeys=k.keys;currentCollection=null;renderWorkspace()}catch(e){toast(e.message,true)}}
function renderWorkspace(){$('#breadcrumb').textContent='Projects / '+currentProject.name;$('#page').innerHTML=`
<div class="heading"><div><button class="btn ghost" id="backProjects" style="margin-bottom:14px">← Projects</button><h1>${escapeHtml(currentProject.name)}</h1><p class="muted">Project ID: <span style="font-family:monospace">${currentProject.id}</span></p></div><button class="btn primary" id="addCollection">＋ Collection</button></div>
<div class="card" style="margin-bottom:16px"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h3 style="margin:0 0 5px">App integrations</h3><p class="muted" style="font-size:12px;margin:0">Register client apps and manage project API keys.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="registerApp">＋ Register app</button><button class="btn ghost" id="manageRules">Security rules</button><button class="btn primary" id="createApiKey">＋ Create API key</button></div></div><div id="integrationRows" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px"></div></div><div class="workspace"><section class="collection-panel"><div style="font:600 15px 'Space Grotesk';margin-bottom:13px">Collections</div>${collections.length?collections.map(c=>`<div class="collection-item ${currentCollection?.id===c.id?'active':''}" data-collection="${c.id}"><span>▤ &nbsp;${escapeHtml(c.name)}</span><span class="muted">${c.documents}</span></div>`).join(''):'<p class="muted" style="font-size:12px">No collections yet.</p>'}</section><section class="data-panel" id="dataPanel">${currentCollection?'<p class="muted">Loading documents…</p>':'<div class="empty">Select a collection or create one to view documents.</div>'}</section></div>`;
$('#backProjects').onclick=()=>navigate('projects');$('#addCollection').onclick=openCollectionModal;$('#registerApp').onclick=openRegisterApp;$('#manageRules').onclick=openSecurityRules;$('#createApiKey').onclick=openCreateApiKey;document.querySelectorAll('[data-collection]').forEach(el=>el.onclick=()=>openCollection(el.dataset.collection));renderIntegrations();}

function renderIntegrations(){
 const host=$('#integrationRows');if(!host)return;
 host.innerHTML=`<div style="border:1px solid var(--line);border-radius:11px;padding:13px"><b style="font-size:13px">Registered apps · ${projectApps.length}</b>${projectApps.length?projectApps.map(a=>`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:9px;margin-top:9px"><div style="min-width:0"><b style="font-size:12px">${escapeHtml(a.name)}</b><div class="muted" style="font-size:11px;overflow-wrap:anywhere">${escapeHtml(a.platform)} · ${escapeHtml(a.app_identifier)}</div></div><button class="btn danger" data-remove-app="${a.id}" style="padding:6px 9px">×</button></div>`).join(''):'<p class="muted" style="font-size:12px;margin:10px 0 0">No apps registered yet.</p>'}</div>
 <div style="border:1px solid var(--line);border-radius:11px;padding:13px"><b style="font-size:13px">Project API keys · ${projectKeys.length}</b>${projectKeys.length?projectKeys.map(k=>`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:9px;margin-top:9px"><div style="min-width:0"><b style="font-size:12px">${escapeHtml(k.name)}</b><div class="muted" style="font-size:11px;overflow-wrap:anywhere">${escapeHtml(k.key_prefix)}… ${k.revoked_at?'· Revoked':''}</div></div>${k.revoked_at?'':'<button class="btn danger" data-revoke-key="'+k.id+'" style="padding:6px 9px">Revoke</button>'}</div>`).join(''):'<p class="muted" style="font-size:12px;margin:10px 0 0">No API keys created yet.</p>'}</div>`;
 document.querySelectorAll('[data-remove-app]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove this app registration?'))return;try{await api('/projects/'+currentProject.id+'/apps/'+b.dataset.removeApp,{method:'DELETE'});projectApps=(await api('/projects/'+currentProject.id+'/apps')).apps;renderIntegrations();toast('App removed')}catch(e){toast(e.message,true)}});
 document.querySelectorAll('[data-revoke-key]').forEach(b=>b.onclick=async()=>{if(!confirm('Revoke this API key? Apps using it will stop authenticating.'))return;try{await api('/projects/'+currentProject.id+'/api-keys/'+b.dataset.revokeKey,{method:'DELETE'});projectKeys=(await api('/projects/'+currentProject.id+'/api-keys')).keys;renderIntegrations();toast('API key revoked')}catch(e){toast(e.message,true)}});
}
function openRegisterApp(){
 modal('Register an app','Add an Android package, iOS bundle identifier, Flutter client or web app.',`<div class="field"><label>App display name</label><input id="appDisplayName" maxlength="80" placeholder="My Android App"></div><div class="field"><label>Platform</label><select id="appPlatform" style="width:100%;padding:12px;background:#080f1d;color:white;border:1px solid var(--line);border-radius:10px"><option value="android">Android</option><option value="ios">iOS</option><option value="web">Web</option><option value="flutter">Flutter</option></select></div><div class="field"><label>Package name / Bundle ID / Web app ID</label><input id="appIdentifier" maxlength="180" placeholder="com.example.myapp"></div>`,async()=>{const name=$('#appDisplayName').value.trim(),platform=$('#appPlatform').value,appIdentifier=$('#appIdentifier').value.trim();await api('/projects/'+currentProject.id+'/apps',{method:'POST',body:JSON.stringify({name,platform,appIdentifier})});closeModal();projectApps=(await api('/projects/'+currentProject.id+'/apps')).apps;renderIntegrations();toast('App registered')});
}
function openCreateApiKey(){
 modal('Create project API key','Give this key a clear name. The secret is shown only once.',`<div class="field"><label>Key name</label><input id="apiKeyName" maxlength="80" placeholder="Android production"></div>`,async()=>{const name=$('#apiKeyName').value.trim();const result=await api('/projects/'+currentProject.id+'/api-keys',{method:'POST',body:JSON.stringify({name})});closeModal();projectKeys=(await api('/projects/'+currentProject.id+'/api-keys')).keys;renderIntegrations();modal('Copy your API key','Copy and store this secret now. Webbase will not show it again.',`<div class="field"><label>API key</label><input id="newApiKeySecret" readonly value="${escapeHtml(result.secret)}"></div><p class="muted" style="font-size:12px">Treat this key as a credential. Revoke it immediately if it is exposed.</p>`,async()=>closeModal());$('#newApiKeySecret').select();toast('API key created — copy it now')});
}


async function openSecurityRules(){
 const saved=(await api('/projects/'+currentProject.id+'/security-rules')).rules;
 const first=collections[0]?.name||'';
 const initial=saved.find(r=>r.collection_name===first)?.rules||{read:false,create:false,update:false,delete:false};
 modal('Collection security rules','Choose a collection and enable only the client operations your app needs. All permissions default to false.',`<div class="field"><label>Collection</label><select id="ruleCollection" style="width:100%;padding:12px;background:#080f1d;color:white;border:1px solid var(--line);border-radius:10px">${collections.map(c=>'<option value="'+escapeHtml(c.name)+'">'+escapeHtml(c.name)+'</option>').join('')}</select></div><div class="field"><label>Permissions JSON</label><textarea id="ruleJson" rows="7" spellcheck="false" style="font-family:monospace">{"read":${!!initial.read},"create":${!!initial.create},"update":${!!initial.update},"delete":${!!initial.delete}}</textarea></div><p class="muted" style="font-size:12px">Example: {"read":true,"create":true,"update":false,"delete":false}</p>`,async()=>{
  const name=$('#ruleCollection').value;let rules;try{rules=JSON.parse($('#ruleJson').value)}catch{throw new Error('Rules must be valid JSON')}
  await api('/projects/'+currentProject.id+'/security-rules/'+encodeURIComponent(name),{method:'PUT',body:JSON.stringify({rules})});closeModal();toast('Security rules saved');
 });
 if(!collections.length)toast('Create a collection first',true);
}

function openCollectionModal(){modal('Create collection','Collections group related JSON documents.',`<div class="field"><label>Collection name</label><input id="collectionName" maxlength="64" placeholder="users"></div>`,async()=>{await api('/projects/'+currentProject.id+'/collections',{method:'POST',body:JSON.stringify({name:$('#collectionName').value.trim()})});closeModal();collections=(await api('/projects/'+currentProject.id+'/collections')).collections;renderWorkspace();toast('Collection created')})}
async function openCollection(id){currentCollection=collections.find(c=>c.id===id);try{documents=(await api('/collections/'+id+'/documents')).documents;renderWorkspace();renderDocuments()}catch(e){toast(e.message,true)}}
function renderDocuments(){const panel=$('#dataPanel');if(!panel)return;panel.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px"><div><b>${escapeHtml(currentCollection.name)}</b><div class="muted" style="font-size:12px;margin-top:5px">${documents.length} documents · latest 100</div></div><button class="btn primary" id="addDoc">＋ Add document</button></div>${documents.length?'<div class="table-wrap"><table><thead><tr><th>DOCUMENT ID</th><th>DATA PREVIEW</th><th>UPDATED</th><th></th></tr></thead><tbody>'+documents.map(d=>`<tr><td style="font-family:monospace">${d.id.slice(0,8)}…</td><td>${escapeHtml(JSON.stringify(d.data).slice(0,60))}</td><td>${new Date(d.updated_at).toLocaleDateString()}</td><td><button class="btn ghost" data-edit="${d.id}">Edit</button> <button class="btn danger" data-delete="${d.id}">×</button></td></tr>`).join('')+'</tbody></table></div>':'<div class="empty">This collection is empty.<br><button class="btn primary" id="firstDoc" style="margin-top:14px">Add first document</button></div>'}`;
$('#addDoc').onclick=openDocModal;const first=$('#firstDoc');if(first)first.onclick=openDocModal;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openDocModal(documents.find(d=>d.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this document?'))return;try{await api('/documents/'+b.dataset.delete,{method:'DELETE'});await openCollection(currentCollection.id);await loadProjects();toast('Document deleted')}catch(e){toast(e.message,true)}})}
function openDocModal(doc){modal(doc?'Edit document':'Add document','Enter a valid JSON object.',`<div class="field"><label>JSON data</label><textarea id="docData" rows="9" spellcheck="false" style="font-family:monospace">${doc?escapeHtml(JSON.stringify(doc.data,null,2)):'{\n  "name": "Ada Lovelace",\n  "active": true\n}'}</textarea></div>`,async()=>{let data;try{data=JSON.parse($('#docData').value)}catch{throw new Error('Invalid JSON. Check commas and quotes.')}if(!data||typeof data!=='object'||Array.isArray(data))throw new Error('JSON must be an object');const path=doc?'/documents/'+doc.id:'/collections/'+currentCollection.id+'/documents';await api(path,{method:doc?'PUT':'POST',body:JSON.stringify({data})});closeModal();await openCollection(currentCollection.id);await loadProjects();toast(doc?'Document updated':'Document added')})}
function renderDocs(){$('#page').innerHTML=`<div class="heading"><div><h1>Documentation</h1><p class="muted">Connect your app to the Webbase API.</p></div></div><div class="card"><h3>REST API</h3><p class="muted">All endpoints use JSON. Pass your session token as a Bearer token.</p><pre style="white-space:pre-wrap;color:#9db4e9;background:#080f1d;padding:16px;border-radius:10px;overflow:auto">Authorization: Bearer YOUR_TOKEN\nContent-Type: application/json</pre><h3 style="margin-top:24px">Available endpoints</h3><table><tbody><tr><td>POST</td><td>/api/auth/register</td><td>Create account</td></tr><tr><td>POST</td><td>/api/auth/login</td><td>Sign in</td></tr><tr><td>GET</td><td>/api/projects</td><td>List projects</td></tr><tr><td>POST</td><td>/api/projects</td><td>Create project</td></tr><tr><td>GET</td><td>/api/projects/:id/collections</td><td>List collections</td></tr><tr><td>POST</td><td>/api/projects/:id/collections</td><td>Create collection</td></tr><tr><td>GET</td><td>/api/collections/:id/documents</td><td>List documents</td></tr><tr><td>POST</td><td>/api/collections/:id/documents</td><td>Create document</td></tr><tr><td>PUT / DELETE</td><td>/api/documents/:id</td><td>Update / delete document</td></tr></tbody></table></div><div class="card" style="margin-top:16px"><h3>Quick example</h3><pre style="white-space:pre-wrap;color:#9db4e9;overflow:auto">fetch('/api/projects', {\n  headers: { Authorization: 'Bearer ' + token }\n}).then(r => r.json()).then(console.log);</pre></div>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function modal(title,desc,body,save){$('#modalRoot').innerHTML=`<div class="modal-back" id="modalBack"><div class="modal"><h2>${title}</h2><p class="muted" style="font-size:13px">${desc}</p>${body}<div class="modal-actions"><button class="btn ghost" id="cancelModal">Cancel</button><button class="btn primary" id="saveModal">Continue</button></div><p id="modalError" style="color:#ff91a0;font-size:12px;margin:12px 0 0"></p></div></div>` ;$('#cancelModal').onclick=closeModal;$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()};$('#saveModal').onclick=async()=>{const b=$('#saveModal');b.disabled=true;try{await save()}catch(e){$('#modalError').textContent=e.message}finally{b.disabled=false}}}
function closeModal(){$('#modalRoot').innerHTML=''}
async function boot(){try{if(!token)return showAuth();const d=await api('/me');user=d.user;$('#authView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#userEmail').textContent=user.email;await loadProjects();navigate('overview')}catch(e){showAuth();toast(e.message,true)}}
boot();
</script></body></html>
