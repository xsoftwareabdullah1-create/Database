services:
  - type: web
    name: webbase
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev --no-audit --no-fund && npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: webbase-db
          property: connectionString

databases:
  - name: webbase-db
    databaseName: webbase
    user: webbase
    plan: free
    postgresMajorVersion: "16"
